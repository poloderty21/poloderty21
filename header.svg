<svg width="100%" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e05638" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#e05638" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e05638" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05638" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: url(#accentGrad);
      letter-spacing: 0.5px;
    }
    .description {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Glow Overlays -->
  <rect x="2" y="2" width="796" height="216" rx="14" fill="url(#glow)" />
  <rect x="2" y="2" width="796" height="216" rx="14" fill="url(#glowCyan)" />

  <!-- Code Graphic Accent -->
  <g transform="translate(48, 42)">
    <!-- Terminal icon or symbol -->
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#e05638" fill-opacity="0.15" stroke="#e05638" stroke-width="1.5" />
    <path d="M11 11L17 17L11 23M19 23H24" stroke="#e05638" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Title and Subtitle -->
    <text x="48" y="24" class="title">Xavier Alexandre</text>
    <text x="48" y="48" class="subtitle">SENIOR AI FRONT-END DEVELOPER &amp; ARCHITECT</text>
    <text x="48" y="74" class="description">Building scalable SaaS interfaces &amp; human-centered AI agentic engineering workflows.</text>
    <text x="48" y="94" class="description">The Human Bridge between Product, UI/UX Design, and Engineering.</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(96, 168)">
    <!-- Badge 1: Vue & Nuxt -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#42b883" />
      <text x="24" y="17" class="badge-text">Vue 3 · Nuxt · Vuetify</text>
    </g>

    <!-- Badge 2: Agentic Workflows -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#e05638" />
      <text x="24" y="17" class="badge-text">Claude Code · Herdr · MCP</text>
    </g>

    <!-- Badge 3: 9+ Years -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#38bdf8" />
      <text x="24" y="17" class="badge-text">9+ Years Exp.</text>
    </g>

    <!-- Badge 4: Location -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#f43f5e" />
      <text x="24" y="17" class="badge-text">Montréal, Canada 🇨🇦</text>
    </g>
  </g>
</svg>
